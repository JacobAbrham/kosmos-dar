---
# Google Calendar MCP Service
apiVersion: v1
kind: Service
metadata:
  name: gcal-mcp
  namespace: kosmos
  labels:
    app.kubernetes.io/name: gcal-mcp
    app.kubernetes.io/component: mcp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gcal-mcp
  ports:
    - name: http
