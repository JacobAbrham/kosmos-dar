# KOSMOS V2.0 ConfigMap Configuration
# Non-sensitive configuration for all services

apiVersion: v1
kind: ConfigMap
metadata:
  name: kosmos-config
  namespace: kosmos
  labels:
    app.kubernetes.io/name: kosmos
    app.kubernetes.io/part-of: kosmos-aeos
data:
  # Environment
  ENVIRONMENT: "production"
  DEBUG: "false"
  LOG_LEVEL: "INFO"

  # Database Configuration
  DATABASE_HOST: "postgres.kosmos.svc.cluster.local"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "kosmos"

  # Redis Configuration
  REDIS_HOST: "redis.kosmos.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_DB: "0"

  # NATS Configuration
  NATS_HOST: "nats.kosmos.svc.cluster.local"
  NATS_PORT: "4222"

  # MCP Gateway Configuration
  MCP_GATEWAY_HOST: "mcp-gateway.kosmos.svc.cluster.local"
  MCP_GATEWAY_PORT: "9000"

  # Frontend Configuration
  NEXT_PUBLIC_API_URL: "https://api.kosmos.io"
  NEXT_PUBLIC_WS_URL: "wss://api.kosmos.io"
  NODE_ENV: "production"

  # Feature Flags
  ENABLE_TELEMETRY: "true"
  ENABLE_SELF_IMPROVEMENT: "true"
  ENABLE_WORKFLOW_AUTOMATION: "true"
  ENABLE_MULTI_TENANCY: "true"

  # Rate Limiting
  RATE_LIMIT_REQUESTS: "1000"
  RATE_LIMIT_WINDOW: "60"

  # Agent Configuration
  MAX_AGENT_CONCURRENT_TASKS: "10"
  AGENT_TIMEOUT_SECONDS: "300"
  ENABLE_PENTARCHY_GOVERNANCE: "true"

  # Observability
  PROMETHEUS_PORT: "9090"
  JAEGER_ENDPOINT: "http://jaeger.kosmos.svc.cluster.local:14268/api/traces"

---
# Backend-specific ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: kosmos-backend-config
  namespace: kosmos
  labels:
    app.kubernetes.io/name: kosmos-backend
    app.kubernetes.io/component: backend
data:
  # FastAPI Configuration
  WORKERS: "4"
  HOST: "0.0.0.0"
  PORT: "8000"

  # CORS Configuration
  CORS_ORIGINS: "https://app.kosmos.io,https://kosmos.io"
  CORS_METHODS: "GET,POST,PUT,DELETE,OPTIONS"

  # Session Configuration
  SESSION_EXPIRE_MINUTES: "60"

  # File Upload
  MAX_UPLOAD_SIZE: "10485760"
  ALLOWED_EXTENSIONS: ".pdf,.docx,.xlsx,.csv,.json,.txt"

---
# Frontend-specific ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: kosmos-frontend-config
  namespace: kosmos
  labels:
    app.kubernetes.io/name: kosmos-frontend
    app.kubernetes.io/component: frontend
data:
  # Next.js Configuration
  NEXT_TELEMETRY_DISABLED: "1"
  HOSTNAME: "0.0.0.0"
  PORT: "3000"

---
# MCP Gateway ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: kosmos-mcp-config
  namespace: kosmos
  labels:
    app.kubernetes.io/name: kosmos-mcp
    app.kubernetes.io/component: mcp-gateway
data:
  # MCP Server Endpoints
  POSTGRES_MCP_URL: "http://postgres-mcp.kosmos.svc.cluster.local:9001"
  REDIS_MCP_URL: "http://redis-mcp.kosmos.svc.cluster.local:9002"
  GITHUB_MCP_URL: "http://github-mcp.kosmos.svc.cluster.local:9003"
  SLACK_MCP_URL: "http://slack-mcp.kosmos.svc.cluster.local:9004"
  EMAIL_MCP_URL: "http://email-mcp.kosmos.svc.cluster.local:9005"
  GCAL_MCP_URL: "http://gcal-mcp.kosmos.svc.cluster.local:9006"
  FILESYSTEM_MCP_URL: "http://filesystem-mcp.kosmos.svc.cluster.local:9007"

  # MCP Configuration
  MCP_MODE: "gateway"
  MCP_TRANSPORT: "http"
  MCP_MAX_CONNECTIONS: "100"
  MCP_TIMEOUT_MS: "30000"

---
# PostgreSQL ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: kosmos
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
data:
  # PostgreSQL Tuning
  POSTGRES_MAX_CONNECTIONS: "200"
  POSTGRES_SHARED_BUFFERS: "2GB"
  POSTGRES_EFFECTIVE_CACHE_SIZE: "6GB"
  POSTGRES_MAINTENANCE_WORK_MEM: "512MB"
  POSTGRES_CHECKPOINT_COMPLETION_TARGET: "0.9"
  POSTGRES_WAL_BUFFERS: "16MB"
  POSTGRES_DEFAULT_STATISTICS_TARGET: "100"
  POSTGRES_RANDOM_PAGE_COST: "1.1"
  POSTGRES_EFFECTIVE_IO_CONCURRENCY: "200"
  POSTGRES_WORK_MEM: "10MB"
  POSTGRES_MIN_WAL_SIZE: "1GB"
  POSTGRES_MAX_WAL_SIZE: "4GB"
