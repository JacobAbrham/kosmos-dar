      targetPort: 9006

---
# External LoadBalancer Service (alternative to Ingress)
apiVersion: v1
kind: Service
metadata:
  name: kosmos-lb
  namespace: kosmos
  labels:
    app.kubernetes.io/name: kosmos
  annotations:
    # AWS NLB
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
    # GCP
    cloud.google.com/load-balancer-type: "Internal"
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: kosmos-frontend
  ports:
    - name: http
      port: 80
      targetPort: 3000
    - name: https
      port: 443
      targetPort: 3000
