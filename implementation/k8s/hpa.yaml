# KOSMOS V2.0 Horizontal Pod Autoscaler Configuration
# Automatic scaling based on CPU, memory, and custom metrics

---
# Backend HPA
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kosmos-backend-hpa
  namespace: kosmos
  labels:
    app.kubernetes.io/name: kosmos-backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kosmos-backend
  minReplicas: 3
  maxReplicas: 20
  metrics:
    # Scale on CPU utilization
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

    # Scale on memory utilization
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

    # Scale on request rate (requires Prometheus Adapter)
    - type: Pods
      pods:
        metric:
          name: http_requests_per_second
        target:
          type: AverageValue
          averageValue: "100"

  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
        - type: Pods
          value: 1
          periodSeconds: 60
      selectPolicy: Min

    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max

---
# Frontend HPA
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kosmos-frontend-hpa
  namespace: kosmos
  labels:
    app.kubernetes.io/name: kosmos-frontend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kosmos-frontend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
      selectPolicy: Min

    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
      selectPolicy: Max

---
# MCP Gateway HPA
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mcp-gateway-hpa
  namespace: kosmos
  labels:
    app.kubernetes.io/name: mcp-gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mcp-gateway
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60

    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30

---
# Vertical Pod Autoscaler for Backend (optional - requires VPA)
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: kosmos-backend-vpa
  namespace: kosmos
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kosmos-backend
  updatePolicy:
    updateMode: "Auto"
  resourcePolicy:
    containerPolicies:
      - containerName: backend
        minAllowed:
          cpu: "250m"
          memory: 512Mi
        maxAllowed:
          cpu: "4"
          memory: 8Gi
        controlledResources:
          - cpu
          - memory

---
# Vertical Pod Autoscaler for Frontend
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: kosmos-frontend-vpa
  namespace: kosmos
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kosmos-frontend
  updatePolicy:
    updateMode: "Auto"
  resourcePolicy:
    containerPolicies:
      - containerName: frontend
        minAllowed:
          cpu: "100m"
          memory: 256Mi
        maxAllowed:
          cpu: "2"
          memory: 4Gi

---
# PodAutoscaler based on custom metrics (KEDA ScaledObject)
# Requires KEDA installation
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: kosmos-backend-keda
  namespace: kosmos
spec:
  scaleTargetRef:
    name: kosmos-backend
  pollingInterval: 15
  cooldownPeriod: 300
  minReplicaCount: 3
  maxReplicaCount: 20
  triggers:
    # Scale on NATS queue depth
    - type: nats-jetstream
      metadata:
        natsServerMonitoringEndpoint: "nats.kosmos.svc.cluster.local:8222"
        account: "$G"
        stream: "agent-tasks"
        consumer: "backend-consumer"
        lagThreshold: "100"

    # Scale on Redis queue length
    - type: redis
      metadata:
        address: redis.kosmos.svc.cluster.local:6379
        listName: task-queue
        listLength: "50"

---
# PrometheusAdapter configuration for custom metrics
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-adapter-config
  namespace: kosmos
data:
  config.yaml: |
    rules:
    - seriesQuery: 'http_requests_total{namespace="kosmos",pod!=""}'
      resources:
        overrides:
          namespace:
            resource: namespace
          pod:
            resource: pod
      name:
        matches: "^(.*)_total$"
        as: "${1}_per_second"
      metricsQuery: 'sum(rate(<<.Series>>{<<.LabelMatchers>>}[2m])) by (<<.GroupBy>>)'

    - seriesQuery: 'agent_task_queue_size{namespace="kosmos"}'
      resources:
        overrides:
          namespace:
            resource: namespace
      name:
        matches: "^(.*)$"
        as: "${1}"
      metricsQuery: 'avg(<<.Series>>{<<.LabelMatchers>>}) by (<<.GroupBy>>)'
