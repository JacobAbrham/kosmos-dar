# ============================================================================
# KOSMOS - Local Development Stack
# Run: docker compose up -d
# ============================================================================

services:
  # --------------------------------------------------------------------------
  # Frontend (Next.js)
  # --------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://backend:8000
      - NEXT_PUBLIC_WS_URL=ws://backend:8000/ws
    depends_on:
      - backend
    volumes:
      # Hot reload for development
      - ./implementation/frontend/src:/app/src:ro
    networks:
      - kosmos-net

  # --------------------------------------------------------------------------
  # Backend (FastAPI) - Placeholder
  # --------------------------------------------------------------------------
  backend:
    image: python:3.11-slim
    working_dir: /app
    command: >
      sh -c "pip install fastapi uvicorn && 
             echo 'from fastapi import FastAPI; app = FastAPI(); 
             @app.get(\"/api/v1/health\") 
             def health(): return {\"status\": \"ok\"}' > main.py && 
             uvicorn main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - kosmos-net

  # --------------------------------------------------------------------------
  # PostgreSQL
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: kosmos
      POSTGRES_PASSWORD: kosmos_dev_password
      POSTGRES_DB: kosmos
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - kosmos-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kosmos"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------------------------
  # Redis (for caching/queues)
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - kosmos-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  kosmos-net:
    driver: bridge

volumes:
  postgres_data:
