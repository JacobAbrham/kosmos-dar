# ============================================================================
# Deploy to Production (Alibaba Cloud)
# Triggered on push to main branch - requires manual approval
# ============================================================================

name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm production deployment'
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/frontend

jobs:
  # --------------------------------------------------------------------------
  # Gate: Require explicit confirmation for manual triggers
  # --------------------------------------------------------------------------
  confirm:
    name: Confirm Deployment
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Validate confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "deploy" ]; then
            echo "❌ Deployment not confirmed. Type 'deploy' to proceed."
            exit 1
          fi
          echo "✅ Deployment confirmed"

  # --------------------------------------------------------------------------
  # Build production image
  # --------------------------------------------------------------------------
  build:
    name: Build Production Image
    runs-on: ubuntu-latest
    needs: [confirm]
    if: always() && (needs.confirm.result == 'success' || needs.confirm.result == 'skipped')
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate version
        id: version
        run: |
          VERSION=$(date +'%Y.%m.%d')-$(git rev-parse --short HEAD)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Version: $VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha,prefix=prod-

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=production

  # --------------------------------------------------------------------------
  # Deploy to Alibaba Cloud
  # --------------------------------------------------------------------------
  deploy:
    name: Deploy to Alibaba Cloud
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: https://kosmos.nuvanta-holding.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e
            echo "🚀 Starting production deployment..."
            
            # Navigate to deployment directory
            cd /opt/kosmos
            
            # Pull latest images
            echo "📥 Pulling latest images..."
            docker compose -f docker-compose.prod.yml pull
            
            # Create backup of current state
            echo "💾 Creating backup..."
            docker compose -f docker-compose.prod.yml exec -T postgres pg_dump -U kosmos kosmos > /backups/pre-deploy-$(date +%Y%m%d-%H%M%S).sql || true
            
            # Deploy with zero downtime
            echo "🔄 Deploying..."
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            
            # Wait for health check
            echo "🏥 Waiting for health check..."
            sleep 10
            curl -f http://localhost:3000/api/health || exit 1
            
            # Cleanup old images
            echo "🧹 Cleaning up..."
            docker image prune -f
            
            echo "✅ Deployment complete!"

      - name: Notify success
        if: success()
        run: |
          echo "✅ Production deployment successful"
          echo "Version: ${{ needs.build.outputs.version }}"
          echo "URL: https://kosmos.nuvanta-holding.com"

      - name: Notify failure
        if: failure()
        run: |
          echo "❌ Production deployment failed"
          echo "Check logs and consider rollback"
