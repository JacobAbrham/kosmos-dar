# KOSMOS V2.0 Kubernetes Services Configuration

---
# Backend Service
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: kosmos
  labels:
    app.kubernetes.io/name: kosmos-backend
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kosmos-backend
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP

---
# Frontend Service
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: kosmos
  labels:
    app.kubernetes.io/name: kosmos-frontend
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kosmos-frontend
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP

---
# PostgreSQL Service
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: kosmos
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  clusterIP: None  # Headless service for StatefulSet
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432

---
# Redis Service
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: kosmos
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379

---
# NATS Service
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: kosmos
  labels:
    app.kubernetes.io/name: nats
    app.kubernetes.io/component: messaging
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nats
  ports:
    - name: client
      port: 4222
      targetPort: 4222
    - name: http
      port: 8222
      targetPort: 8222

---
# MCP Gateway Service
apiVersion: v1
kind: Service
metadata:
  name: mcp-gateway
  namespace: kosmos
  labels:
    app.kubernetes.io/name: mcp-gateway
    app.kubernetes.io/component: mcp-gateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mcp-gateway
  ports:
    - name: http
      port: 9000
      targetPort: 9000

---
# PostgreSQL MCP Service
apiVersion: v1
kind: Service
metadata:
  name: postgres-mcp
  namespace: kosmos
  labels:
    app.kubernetes.io/name: postgres-mcp
    app.kubernetes.io/component: mcp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres-mcp
  ports:
    - name: http
      port: 9001
      targetPort: 9001

---
# Redis MCP Service
apiVersion: v1
kind: Service
metadata:
  name: redis-mcp
  namespace: kosmos
  labels:
    app.kubernetes.io/name: redis-mcp
    app.kubernetes.io/component: mcp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis-mcp
  ports:
    - name: http
      port: 9002
      targetPort: 9002

---
# GitHub MCP Service
apiVersion: v1
kind: Service
metadata:
  name: github-mcp
  namespace: kosmos
  labels:
    app.kubernetes.io/name: github-mcp
    app.kubernetes.io/component: mcp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: github-mcp
  ports:
    - name: http
      port: 9003
      targetPort: 9003

---
# Slack MCP Service
apiVersion: v1
kind: Service
metadata:
  name: slack-mcp
  namespace: kosmos
  labels:
    app.kubernetes.io/name: slack-mcp
    app.kubernetes.io/component: mcp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: slack-mcp
  ports:
    - name: http
      port: 9004
      targetPort: 9004

---
# Email MCP Service
apiVersion: v1
kind: Service
metadata:
  name: email-mcp
  namespace: kosmos
  labels:
    app.kubernetes.io/name: email-mcp
    app.kubernetes.io/component: mcp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: email-mcp
  ports:
    - name: http
