# KOSMOS V2.0 Docker Compose - Development Configuration
# Run: docker-compose up -d

version: "3.9"

services:
  # ==========================================================================
  # Core Application Services
  # ==========================================================================

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
      target: development
    container_name: kosmos-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://kosmos:kosmos@postgres:5432/kosmos
      - REDIS_URL=redis://redis:6379/0
      - NATS_URL=nats://nats:4222
      - ENVIRONMENT=development
      - DEBUG=true
      - LOG_LEVEL=DEBUG
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - JWT_SECRET=${JWT_SECRET:-dev-secret-key-change-in-production}
    volumes:
      - ../backend:/app:cached
      - backend-cache:/app/.cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kosmos-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      target: development
    container_name: kosmos-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
      - NODE_ENV=development
    volumes:
      - ../frontend:/app:cached
      - frontend-node-modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - kosmos-network

  # ==========================================================================
  # Infrastructure Services
  # ==========================================================================

  postgres:
    image: pgvector/pgvector:pg16
    container_name: kosmos-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=kosmos
      - POSTGRES_PASSWORD=kosmos
      - POSTGRES_DB=kosmos
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../database/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - kosmos-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kosmos"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kosmos-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - kosmos-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2-alpine
    container_name: kosmos-nats
    restart: unless-stopped
    ports:
      - "4222:4222"   # Client connections
      - "8222:8222"   # HTTP management
    command: --jetstream --store_dir=/data
    volumes:
      - nats-data:/data
    networks:
      - kosmos-network

  # ==========================================================================
  # MCP Gateway (Orchestrates MCP Servers)
  # ==========================================================================

  mcp-gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile.mcp
      target: production
    container_name: kosmos-mcp-gateway
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      - MCP_MODE=gateway
      - POSTGRES_MCP_URL=http://postgres-mcp:9001
      - REDIS_MCP_URL=http://redis-mcp:9002
      - GITHUB_MCP_URL=http://github-mcp:9003
    depends_on:
      - postgres-mcp
      - redis-mcp
    networks:
      - kosmos-network

  # ==========================================================================
  # MCP Servers
  # ==========================================================================

  postgres-mcp:
    build:
      context: ..
      dockerfile: docker/Dockerfile.mcp
      target: postgres-mcp
    container_name: kosmos-postgres-mcp
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://kosmos:kosmos@postgres:5432/kosmos
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kosmos-network

  redis-mcp:
    build:
      context: ..
      dockerfile: docker/Dockerfile.mcp
      target: redis-mcp
    container_name: kosmos-redis-mcp
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - kosmos-network

  github-mcp:
    build:
      context: ..
      dockerfile: docker/Dockerfile.mcp
      target: github-mcp
    container_name: kosmos-github-mcp
    restart: unless-stopped
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
    networks:
      - kosmos-network

  # ==========================================================================
  # Observability (Development)
  # ==========================================================================

  adminer:
    image: adminer:latest
    container_name: kosmos-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=postgres
    depends_on:
      - postgres
    networks:
      - kosmos-network

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: kosmos-redis-commander
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
    depends_on:
      - redis
    networks:
      - kosmos-network

# ==========================================================================
# Networks
# ==========================================================================

networks:
  kosmos-network:
    driver: bridge
    name: kosmos-network

# ==========================================================================
# Volumes
# ==========================================================================

volumes:
  postgres-data:
    name: kosmos-postgres-data
  redis-data:
    name: kosmos-redis-data
  nats-data:
    name: kosmos-nats-data
  backend-cache:
    name: kosmos-backend-cache
  frontend-node-modules:
    name: kosmos-frontend-node-modules
