version: '3.9'

# =============================================================================
# KOSMOS V2.0 Development Environment
# =============================================================================

services:
  # ===========================================================================
  # DATABASE - PostgreSQL 16 with Extensions
  # ===========================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: kosmos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kosmos}
      POSTGRES_USER: ${POSTGRES_USER:-kosmos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kosmos_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kosmos"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kosmos-network

  # ===========================================================================
  # CACHE - Dragonfly (Redis-compatible)
  # ===========================================================================
  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly
    container_name: kosmos-dragonfly
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - dragonfly_data:/data
    ulimits:
      memlock: -1
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kosmos-network

  # ===========================================================================
  # MESSAGE QUEUE - NATS
  # ===========================================================================
  nats:
    image: nats:2.10-alpine
    container_name: kosmos-nats
    restart: unless-stopped
    ports:
      - "4222:4222"   # Client connections
      - "8222:8222"   # HTTP monitoring
    command: ["--js", "--sd", "/data", "-m", "8222"]
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kosmos-network

  # ===========================================================================
  # OBJECT STORAGE - MinIO
  # ===========================================================================
  minio:
    image: minio/minio:latest
    container_name: kosmos-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kosmos-network

  # ===========================================================================
  # AUTHENTICATION - Zitadel
  # ===========================================================================
  zitadel:
    image: ghcr.io/zitadel/zitadel:latest
    container_name: kosmos-zitadel
    restart: unless-stopped
    command: start-from-init --masterkey "${ZITADEL_MASTERKEY:-MasterkeyNeedsToHave32Characters}" --tlsMode disabled
    environment:
      ZITADEL_DATABASE_POSTGRES_HOST: postgres
      ZITADEL_DATABASE_POSTGRES_PORT: 5432
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: ${ZITADEL_DB_USER:-zitadel_user}
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ${ZITADEL_DB_PASSWORD:-zitadel_pw}
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: ${POSTGRES_USER:-kosmos}
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: ${POSTGRES_PASSWORD:-kosmos_dev_password}
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      ZITADEL_EXTERNALSECURE: false
      ZITADEL_EXTERNALPORT: 8080
      ZITADEL_EXTERNALDOMAIN: localhost
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: ${ZITADEL_ADMIN_USERNAME:-admin@kosmos.local}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${ZITADEL_ADMIN_PASSWORD:-Admin123!}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kosmos-network

  # ===========================================================================
  # LLM ROUTER - LiteLLM
  # ===========================================================================
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: kosmos-litellm
    restart: unless-stopped
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-litellm-master-key}
      DATABASE_URL: postgresql://${POSTGRES_USER:-kosmos}:${POSTGRES_PASSWORD:-kosmos_dev_password}@postgres:5432/litellm
      STORE_MODEL_IN_DB: "True"
    ports:
      - "4000:4000"
    volumes:
      - ./infrastructure/docker/litellm_config.yaml:/app/config.yaml
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kosmos-network

  # ===========================================================================
  # OBSERVABILITY - Langfuse
  # ===========================================================================
  langfuse:
    image: langfuse/langfuse:2
    container_name: kosmos-langfuse
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://kosmos:kosmos_dev_password@postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:3001
      NEXTAUTH_SECRET: langfuse-secret-key
      SALT: langfuse-salt
      ENCRYPTION_KEY: f95999e2930f76f8f67b3798bb1eb4f79951a57d34763c8654aaea62c1cb44cd
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kosmos-network

  # ===========================================================================
  # OBSERVABILITY - Prometheus
  # ===========================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: kosmos-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/docker/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - kosmos-network

  # ===========================================================================
  # OBSERVABILITY - Grafana
  # ===========================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: kosmos-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: false
    ports:
      - "3002:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/docker/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - kosmos-network

  # ===========================================================================
  # OBSERVABILITY - Jaeger (Tracing)
  # ===========================================================================
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: kosmos-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: true
    ports:
      - "16686:16686"  # UI
      - "6831:6831/udp"  # Thrift compact
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
    networks:
      - kosmos-network

  # ===========================================================================
  # BACKEND - FastAPI Application
  # ===========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kosmos-backend
    restart: unless-stopped
    environment:
      - KOSMOS_ENV=development
      - DATABASE_URL=postgresql://kosmos:Pass1994Word@postgres:5432/kosmos
      - REDIS_URL=redis://dragonfly:6379
      - NATS_URL=nats://nats:4222
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - kosmos-network
    profiles:
      - full

  # ===========================================================================
  # FRONTEND - Next.js Application
  # ===========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kosmos-frontend
    restart: unless-stopped
    environment:
      - KOSMOS_INTERNAL_API_URL=http://backend:8000
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - kosmos-network
    profiles:
      - full

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  kosmos-network:
    driver: bridge

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  postgres_data:
  dragonfly_data:
  nats_data:
  minio_data:
  prometheus_data:
  grafana_data:
