# KOSMOS AEOS - Railway Deployment Configuration
# https://railway.app

[build]
builder = "NIXPACKS"
buildCommand = "npm install && npm run build"

[deploy]
startCommand = "npm run start"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Environment variables are set in Railway dashboard
# Required variables:
# - DATABASE_URL (provisioned by Railway PostgreSQL)
# - REDIS_URL (provisioned by Railway Redis)
# - ANTHROPIC_API_KEY
# - JWT_SECRET
# - ENCRYPTION_KEY
