# KOSMOS V2.0 Kubernetes Secrets Configuration
# IMPORTANT: These are templates - actual values should be managed via:
# - Sealed Secrets (Bitnami)
# - External Secrets Operator
# - HashiCorp Vault
# - Cloud provider secret managers (AWS Secrets Manager, GCP Secret Manager, Azure Key Vault)

apiVersion: v1
kind: Secret
metadata:
  name: kosmos-secrets
  namespace: kosmos
  labels:
    app.kubernetes.io/name: kosmos
    app.kubernetes.io/part-of: kosmos-aeos
type: Opaque
stringData:
  # Database Credentials (base64 encoded in production)
  DATABASE_URL: "postgresql://kosmos:CHANGE_ME@postgres:5432/kosmos"
  DATABASE_PASSWORD: "CHANGE_ME"

  # Redis Credentials
  REDIS_URL: "redis://redis:6379/0"
  REDIS_PASSWORD: ""

  # NATS Credentials
  NATS_URL: "nats://nats:4222"

  # JWT Configuration
  JWT_SECRET: "CHANGE_ME_TO_A_SECURE_256_BIT_KEY"
  JWT_ALGORITHM: "HS256"

  # API Keys (LLM Providers)
  ANTHROPIC_API_KEY: "CHANGE_ME"
  OPENAI_API_KEY: "CHANGE_ME"

  # Encryption Key for sensitive data at rest
  ENCRYPTION_KEY: "CHANGE_ME_TO_A_SECURE_256_BIT_KEY"

---
# GitHub MCP Secret
apiVersion: v1
kind: Secret
metadata:
  name: github-mcp-secret
  namespace: kosmos
  labels:
    app.kubernetes.io/name: github-mcp
    app.kubernetes.io/component: mcp
type: Opaque
stringData:
  GITHUB_TOKEN: "CHANGE_ME"
  GITHUB_APP_ID: ""
  GITHUB_APP_PRIVATE_KEY: ""

---
# Slack MCP Secret
apiVersion: v1
kind: Secret
metadata:
  name: slack-mcp-secret
  namespace: kosmos
  labels:
    app.kubernetes.io/name: slack-mcp
    app.kubernetes.io/component: mcp
type: Opaque
stringData:
  SLACK_BOT_TOKEN: "CHANGE_ME"
  SLACK_APP_TOKEN: "CHANGE_ME"
  SLACK_SIGNING_SECRET: "CHANGE_ME"

---
# Email MCP Secret
apiVersion: v1
kind: Secret
metadata:
  name: email-mcp-secret
  namespace: kosmos
  labels:
    app.kubernetes.io/name: email-mcp
    app.kubernetes.io/component: mcp
type: Opaque
stringData:
  SMTP_HOST: "smtp.example.com"
  SMTP_PORT: "587"
  SMTP_USER: "CHANGE_ME"
  SMTP_PASSWORD: "CHANGE_ME"
  IMAP_HOST: "imap.example.com"
  IMAP_PORT: "993"
  IMAP_USER: "CHANGE_ME"
  IMAP_PASSWORD: "CHANGE_ME"

---
# Google Calendar MCP Secret
apiVersion: v1
kind: Secret
metadata:
  name: gcal-mcp-secret
  namespace: kosmos
  labels:
    app.kubernetes.io/name: gcal-mcp
    app.kubernetes.io/component: mcp
type: Opaque
stringData:
  GOOGLE_CLIENT_ID: "CHANGE_ME"
  GOOGLE_CLIENT_SECRET: "CHANGE_ME"
  GOOGLE_REFRESH_TOKEN: "CHANGE_ME"

---
# SSO/OAuth Secret
apiVersion: v1
kind: Secret
metadata:
  name: sso-secret
  namespace: kosmos
  labels:
    app.kubernetes.io/name: kosmos
    app.kubernetes.io/component: auth
type: Opaque
stringData:
  # SAML Configuration
  SAML_IDP_METADATA_URL: ""
  SAML_SP_ENTITY_ID: ""
  SAML_SP_CERT: ""
  SAML_SP_KEY: ""

  # OIDC Configuration
  OIDC_ISSUER_URL: ""
  OIDC_CLIENT_ID: "CHANGE_ME"
  OIDC_CLIENT_SECRET: "CHANGE_ME"

---
# TLS Secret (managed by cert-manager in production)
apiVersion: v1
kind: Secret
metadata:
  name: kosmos-tls
  namespace: kosmos
  labels:
    app.kubernetes.io/name: kosmos
    app.kubernetes.io/component: ingress
type: kubernetes.io/tls
data:
  # These should be managed by cert-manager
  tls.crt: ""
  tls.key: ""

---
# Image Pull Secret (for private registries)
apiVersion: v1
kind: Secret
metadata:
  name: kosmos-registry
  namespace: kosmos
  labels:
    app.kubernetes.io/name: kosmos
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: ""
